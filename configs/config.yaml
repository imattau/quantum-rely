relay:
  listen: ":8080"
  public_url: ""
  name: "Quantum Relay"
  description: "Nostr relay with quantum walk propagation"

peer:
  listen: ":8081"
  public_port: 8443

quantum:
  gamma: 0.5
  fetch_threshold: 0.05
  consensus_tick_ms: 500
  quantum_tick_ms: 1000
  max_concurrent_fetches: 32

spam:
  client_events_per_sec: 10
  peer_announce_per_sec: 100

storage:
  path: "rely.db"

auth:
  required: false
  # Optional. When set, only these Nostr pubkeys may publish events. Values
  # may be npub1... strings or 64-character hex pubkeys.
  allowed_pubkeys: []

dashboard:
  enabled: false
  admin_pubkeys: []
  poll_interval_ms: 3000
  history_seconds: 300

peers:
  - "ws://relay1.example.com:8081"
  - "ws://relay2.example.com:8081"

trust:
  enabled: false
  weight: 2.0
  peers:
    - "ws://relay1.example.com:8081"
